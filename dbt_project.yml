name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.11.0", "<2.0.0"]

vars:
  payment_currency: "{{ env_var('DBT_PAYMENT_CURRENCY', 'AUD') }}"
  cents_divisor: 100
  # Toggle for including PII columns (first_name, last_name) in mart
  # outputs. Override at runtime with: dbt run --vars '{include_pii: false}'
  include_pii: true
  # Number of days of recent data to keep when running in dev. Used by
  # the limit_data_in_dev() macro. Override with --vars '{dev_data_days: 7}'.
  dev_data_days: 3

query-comment:
  comment: "dbt: {{ node.unique_id }}"
  append: true

on-run-start:
  - "{{ log('Starting dbt run for project: ' ~ project_name, info=true) }}"

on-run-end:
  - "{{ log('Finished dbt run. Results: ' ~ results|length ~ ' nodes processed.', info=true) }}"

seeds:
  +docs:
    node_color: '#cd7f32'

models:
  jaffle_shop:
    +materialized: table
    +persist_docs:
      relation: true
      columns: true
    +grants:
      select: ['analytics_reader']
    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: 'silver'
    +docs:
      node_color: 'gold'
