version: 2

models:
  - name: customers
    description: This table has basic information about a customer, as well as some derived facts based on a customer's orders
    config:
      tags: ['marts']
      group: marts
      grants:
        select: ['reporter', 'analytics_reader']
    access: public
    meta:
      owner: analytics
      contains_pii: true
    latest_version: 1

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - first_name
              - last_name

    columns:
      - name: customer_key
        description: Surrogate key generated from customer_id using dbt_utils.generate_surrogate_key.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: This is a unique identifier for a customer
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name. PII.
        meta:
          contains_pii: true

      - name: last_name
        description: Customer's last name. PII.
        meta:
          contains_pii: true

      - name: first_order
        description: Date (UTC) of a customer's first order

      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order

      - name: number_of_orders
        description: Count of the number of orders a customer has placed
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

      - name: customer_lifetime_value
        description: '{{ doc("customer_lifetime_value") }}'
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 or customer_lifetime_value is null"

      - name: customer_status
        description: >
          Derived status: 'active' if the customer ordered in the last
          90 days, 'churned' if longer ago, 'never_ordered' otherwise.
          Only present in v2.

    versions:
      - v: 1
        # v1 is the current latest — uses the default file name
        # (customers.sql) with no suffix. Excludes the v2-only column.
        # Aliased as "customers" so the latest-version DB relation is
        # addressable both as customers_v1 (versioned) and as customers
        # (the dbt-recommended "latest version" alias pattern).
        defined_in: customers
        config:
          alias: customers
        columns:
          - include: '*'
            exclude: ['customer_status']
        # Slate v1 for deprecation 90 days from now to give downstream
        # consumers a known migration window.
        deprecation_date: 2026-07-26 00:00:00+00:00

      - v: 2
        # v2 is "prerelease" — adds customer_status. Defined in
        # customers_v2.sql. Will become latest after the migration
        # window for v1 closes.
        columns:
          - include: '*'

  - name: orders
    description: This table has basic information about orders, as well as some derived facts based on payments
    config:
      tags: ['marts']
      group: marts
      contract:
        enforced: true
    access: public
    meta:
      owner: analytics
    columns:
      - name: order_id
        data_type: integer
        constraints:
          - type: primary_key
        data_tests:
          - unique:
              config:
                tags: ['critical']
          - not_null:
              config:
                tags: ['critical']
        description: This is a unique identifier for an order

      - name: customer_id
        data_type: integer
        constraints:
          # not_null is enforced by DuckDB at create time. A foreign_key
          # constraint to customers(customer_id) would require a primary
          # key or unique constraint on customers, which would require
          # contracting that model too. Use the relationships data test
          # below for portable cross-platform foreign key validation.
          - type: not_null
        description: Foreign key to the customers table
        data_tests:
          - not_null:
              config:
                tags: ['critical']
          - relationships:
              config:
                tags: ['critical', 'referential_integrity']
              arguments:
                to: ref('customers', v=1)
                field: customer_id

      - name: order_date
        data_type: date
        constraints:
          - type: not_null
        description: Date (UTC) that the order was placed

      - name: status
        data_type: varchar
        constraints:
          - type: not_null
          - type: check
            name: orders_status_check
            expression: "status in ('placed', 'shipped', 'completed', 'return_pending', 'returned')"
        description: '{{ doc("orders_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

      - name: amount
        data_type: double
        constraints:
          - type: check
            name: orders_amount_non_negative
            expression: "amount >= 0"
        description: Total amount (AUD) of the order
        data_tests:
          - not_null:
              config:
                where: "status != 'returned'"
          - is_positive:
              config:
                severity: warn
                warn_if: ">0"
                error_if: ">10"
                store_failures: true

      - name: credit_card_amount
        data_type: double
        description: Amount of the order (AUD) paid for by credit card
        data_tests:
          - not_null

      - name: coupon_amount
        data_type: double
        description: Amount of the order (AUD) paid for by coupon
        data_tests:
          - not_null

      - name: bank_transfer_amount
        data_type: double
        description: Amount of the order (AUD) paid for by bank transfer
        data_tests:
          - not_null

      - name: gift_card_amount
        data_type: double
        description: Amount of the order (AUD) paid for by gift card
        data_tests:
          - not_null

  - name: order_payment_summary
    description: Incremental summary of order payments. Demonstrates incremental materialization and ephemeral model dependency.
    config:
      tags: ['marts']
      group: marts
    access: public
    columns:
      - name: order_id
        description: Primary key — unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customers.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current order status.
      - name: total_payment_amount
        description: Sum of all payments for this order (AUD).
      - name: payment_count
        description: Number of individual payments for this order.
      - name: loaded_at
        description: Timestamp when this row was loaded/updated.

  - name: date_spine
    description: Date dimension table generated using dbt_utils.date_spine. Provides one row per day for reporting and gap analysis.
    config:
      tags: ['utility']
      group: utility
    access: public
    columns:
      - name: date_day
        description: Calendar date.
        data_tests:
          - unique
          - not_null
      - name: year
        description: Year extracted from the date.
      - name: month
        description: Month number extracted from the date.
      - name: day_of_month
        description: Day of month extracted from the date.
      - name: day_of_week
        description: Day of week number.

# Unit tests live in the same YAML file as their target model to avoid
# parse-order issues on filesystems that don't iterate lexicographically
# (e.g. ext4). Pinning to v1 prevents v2 (which has an extra column) from
# implicitly inheriting these tests.
unit_tests:
  - name: test_customers_lifetime_value
    description: >
      Verify that customer_lifetime_value is correctly calculated as the
      sum of all payment amounts for a customer's orders.
    model: customers
    versions:
      include: [1]
    given:
      - input: ref('stg_customers')
        rows:
          - { customer_id: 1, first_name: "Alice", last_name: "A" }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, customer_id: 1, order_date: "2024-01-01", status: "completed" }
          - { order_id: 2, customer_id: 1, order_date: "2024-02-01", status: "completed" }
      - input: ref('stg_payments')
        rows:
          - { payment_id: 1, order_id: 1, payment_method: "credit_card", amount: 10.00 }
          - { payment_id: 2, order_id: 2, payment_method: "coupon", amount: 25.50 }
    expect:
      rows:
        - customer_id: 1
          first_name: "Alice"
          last_name: "A"
          first_order: "2024-01-01"
          most_recent_order: "2024-02-01"
          number_of_orders: 2
          customer_lifetime_value: 35.50

  - name: test_customers_no_orders
    description: >
      Verify that a customer with no orders has null aggregates.
    model: customers
    versions:
      include: [1]
    given:
      - input: ref('stg_customers')
        rows:
          - { customer_id: 99, first_name: "Bob", last_name: "B" }
      - input: ref('stg_orders')
        rows: []
      - input: ref('stg_payments')
        rows: []
    expect:
      rows:
        - customer_id: 99
          first_name: "Bob"
          last_name: "B"
          first_order: null
          most_recent_order: null
          number_of_orders: null
          customer_lifetime_value: null
