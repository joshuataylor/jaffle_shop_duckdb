version: 2

snapshots:
  - name: orders_snapshot
    description: >
      Tracks order status changes over time using SCD Type 2.
      Each row represents a historical state of an order.
    relation: ref('jaffle_shop', 'raw_orders')
    config:
      schema: snapshots
      unique_key: id
      strategy: check
      check_cols:
        - status
      hard_deletes: invalidate
      snapshot_meta_column_names:
        dbt_valid_from: valid_from_ts
        dbt_valid_to: valid_to_ts
        dbt_scd_id: scd_id
        dbt_updated_at: updated_at_ts
        dbt_is_deleted: is_deleted
    columns:
      - name: id
        description: Unique order identifier from the source system.
      - name: user_id
        description: Foreign key to the customer who placed this order.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: >
          Current status of the order. One of: placed, shipped,
          completed, return_pending, returned.
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: valid_from_ts
        description: Timestamp when this snapshot row became valid (renamed from dbt_valid_from).
      - name: valid_to_ts
        description: >
          Timestamp when this snapshot row was superseded
          (renamed from dbt_valid_to). NULL for the current record.
      - name: scd_id
        description: Surrogate key for the snapshot row (renamed from dbt_scd_id).
      - name: updated_at_ts
        description: Timestamp of the snapshot run that produced this row (renamed from dbt_updated_at).
      - name: is_deleted
        description: Marker for hard-deleted rows (renamed from dbt_is_deleted).
